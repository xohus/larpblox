name: Build iOS overlay
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Compile arm64 iOS overlay
        run: |
          mkdir -p dist
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" -miphoneos-version-min=14.0 -fobjc-arc -dynamiclib -framework CoreGraphics -framework QuartzCore -framework UIKit -framework WebKit -install_name @rpath/LarpOverlay.dylib LarpOverlay.m -o dist/LarpOverlay.dylib
          cp LarpConsole.html dist/
      - uses: actions/upload-artifact@v4
        with:
          name: larpblox-overlay
          path: dist/
          if-no-files-found: error
